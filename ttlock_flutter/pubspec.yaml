name: ttlock_flutter
description: The ttLock flutter plugin for smart lock and gateway (federated, On-Premise).
version: 0.0.3
homepage: https://github.com/ttlock/ttlock_flutter.git
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  ttlock_flutter_platform_interface:
    git: 
      url: https://github.com/ttlock/ttlock_flutter.git
      path: ttlock_flutter_platform_interface
      ref: mix
  ttlock_flutter_android:
    git: 
      url: https://github.com/2000Heart/ttlock_flutter_android.git
  ttlock_flutter_ios:
    git: 
      url: https://github.com/2000Heart/ttlock_flutter_ios.git
  ttlock_flutter_ohos:
    git: 
      url: https://github.com/ttlock/ttlock_flutter.git
      path: ttlock_flutter_ohos
      ref: mix

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: ttlock_flutter_android
      ios:
        default_package: ttlock_flutter_ios
      ohos:
        default_package: ttlock_flutter_ohos

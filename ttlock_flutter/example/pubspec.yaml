name: ttlock_flutter_example
description: Modern example app for ttlock_flutter plugin.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.0
  hooks_riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^16.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.5
  permission_handler: ^11.3.1
  wifi_iot: ^0.3.19+2
  wifi_scan: ^0.4.1+2
  cupertino_icons: ^1.0.8
  ttlock_flutter:
    path: ../
  loader_overlay: ^5.0.0
  toastification: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  go_router_builder: ^3.0.1
  flutter_lints: ^5.0.0

dependency_overrides:
  permission_handler:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_permission_handler.git
      path: permission_handler
      ref: br_permission_handler_v11.3.1_ohos
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.3_ohos
  # ttlock_flutter_android:
  #   git:
  #     url: https://github.com/2000Heart/ttlock_flutter_android.git
  #     ref: premise
  # ttlock_flutter_ios:
  #   git:
  #     url: https://github.com/2000Heart/ttlock_flutter_ios.git
  #     ref: premise

flutter:
  uses-material-design: true
